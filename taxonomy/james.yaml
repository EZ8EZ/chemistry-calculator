# Taxonomy for James Zhang (PhD student, Chemistry, Johns Hopkins University;
# Huang lab). Research focus: biocatalysis / enzyme engineering — non-heme
# iron and nickel enzyme engineering, directed evolution, ligand-to-metal
# charge transfer (LMCT) photocatalysis, nickel-catalyzed C(sp2)-S coupling,
# radical biocatalysis.
#
# scoring_bias: breadth — as a PhD student, some methods/technique papers
# outside his exact system are still valuable for building literature
# awareness and picking up transferable techniques. Allow a bit more into
# Band B/C than for a senior-PI profile. See prompts/relevance_scoring.md.

profile_summary: >
  James Zhang works in Xiongyi Huang's lab on engineering non-heme
  iron/nickel metalloenzymes for new-to-nature reactivity — e.g. repurposing
  the non-heme iron enzyme PsEFE with a nickel-substituted active site to do
  photoinduced ligand-to-metal charge transfer (LMCT) chemistry, enabling
  nickel-catalyzed C(sp2)-S cross-coupling via directed evolution. Broader
  interests: directed evolution methodology, photoenzymatic catalysis, and
  radical biocatalysis generally.

tier_1_must_not_miss:
  - non-heme iron enzyme engineering (e.g. Fe(II)/alpha-KG-dependent enzymes)
  - non-heme nickel enzyme / nickel-substituted metalloenzyme active sites
  - "directed evolution of biocatalysts (methodology - high-throughput
    screening/selection, ancestral sequence reconstruction, ML-guided evolution)"
  - ligand-to-metal charge transfer (LMCT) photocatalysis (organic or
    organometallic, e.g. cerium- or iron-LMCT radical generation)
  - nickel-catalyzed C(sp2)-S coupling / thioetherification
  - photoenzymatic catalysis (light-driven enzyme reactions, photoexcited
    cofactors)
  - radical biocatalysis broadly (radical SAM enzymes, flavin-dependent
    radical enzymes, engineered metalloenzyme radical intermediates)
  - metalloenzyme active-site engineering for abiotic/new-to-nature reactivity

tier_2_broader_awareness:
  - heme-enzyme engineering (P450s, etc.) as comparative/methodological reference
  - new directed-evolution platforms/tools generally (yeast display,
    phage-assisted evolution, microfluidic high-throughput screening)
  - photoredox catalysis methodology broadly, not limited to LMCT
  - nickel-catalyzed cross-coupling broadly (C-N, C-O, C-C), beyond just C-S
  - biocatalytic C-H functionalization / new-to-nature enzyme reactions generally
  - computational enzyme design (e.g. Rosetta- or AlphaFold-guided active-site
    design, ML-guided protein engineering)
  - radical-clock / mechanistic-probe studies applied to enzymatic systems

